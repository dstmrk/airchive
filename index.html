<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<!-- A crawler reads no JavaScript, thus the title and the description
		     are here and not in the catalogue of text. The page of a shared
		     flight gets its own tags from the Worker. Refer to paragraph 5.3 of
		     docs/architecture.md. -->
		<meta
			name="description"
			content="Turn your boarding passes into a paper keepsake of each flight."
		/>
		<title>airchive — Every flight has a story</title>
		<!-- scripts/icons/build.mjs writes these files from src/client/brand/mark.ts. -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#ece6da" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
